project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536

[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"; /usr/bin/python3 "$ROOT/.codex/hooks/session_start_context.py"'
timeout = 30
statusMessage = "Loading workspace context"

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"; /usr/bin/python3 "$ROOT/.codex/hooks/pre_tool_use_policy.py"'
timeout = 30
statusMessage = "Checking command policy"
