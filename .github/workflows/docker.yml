name: Docker Launcher

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const image = process.env.IMAGE_NAME.toLowerCase();
            const body = [
              '## Docker Launcher',
              '',
              `Tag: \`${tag}\``,
              '',
              'This image downloads the latest `Cosgy-Dev/JMusicBot-JP` release jar at container startup.',
              '',
              '### 1. Pull image',
              '',
              '```bash',
              `docker pull ${image}:${tag}`,
              '```',
              '',
              '### 2. Create config.txt',
              '',
              'Linux / macOS / WSL:',
              '',
              '```bash',
              'mkdir -p docker-data',
              `docker run --rm -v "$(pwd)/docker-data:/data" ${image}:${tag}`,
              '```',
              '',
              'Windows PowerShell:',
              '',
              '```powershell',
              'New-Item -ItemType Directory -Force docker-data',
              `docker run --rm -v "$((Get-Location).Path)\\docker-data:/data" ${image}:${tag}`,
              '```',
              '',
              'The first run creates `docker-data/config.txt` and stops because `token` and `owner` are still placeholders.',
              'It may exit with a non-zero status on this first run. That is expected if `docker-data/config.txt` was created.',
              '',
              'Edit `docker-data/config.txt`:',
              '',
              '```txt',
              'token = "YOUR_DISCORD_BOT_TOKEN"',
              'owner = 123456789012345678',
              '```',
              '',
              '- `token` must be a Discord Bot token and must be quoted.',
              '- `owner` must be your Discord user ID and is written without quotes.',
              '- Do not commit or publish a real `docker-data/config.txt` containing tokens.',
              '',
              '### 3. Start bot',
              '',
              'Linux / macOS / WSL:',
              '',
              '```bash',
              'docker run -d \\',
              '  --name jmusicbot-jp \\',
              '  --restart unless-stopped \\',
              '  -v "$(pwd)/docker-data:/data" \\',
              `  ${image}:${tag}`,
              '```',
              '',
              'Windows PowerShell:',
              '',
              '```powershell',
              'docker run -d `',
              '  --name jmusicbot-jp `',
              '  --restart unless-stopped `',
              '  -v "$((Get-Location).Path)\\docker-data:/data" `',
              `  ${image}:${tag}`,
              '```',
              '',
              'Logs:',
              '',
              '```bash',
              'docker logs -f jmusicbot-jp',
              '```',
              '',
              '### Notes',
              '',
              '- If you use this repository locally, `setup.bat` works on Windows and `./setup.sh` works on Linux / WSL.',
              '- `config.template.txt` is only the template. Edit the generated `docker-data/config.txt` for actual bot settings.',
              '- To refresh the upstream jar, stop the container and delete `docker-data/runtime/` before starting again.'
            ].join('\n');

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                name: tag,
                body,
                draft: false,
                prerelease: /(?:alpha|beta|rc|pre)/i.test(tag)
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                body,
                generate_release_notes: true,
                draft: false,
                prerelease: /(?:alpha|beta|rc|pre)/i.test(tag)
              });
            }
