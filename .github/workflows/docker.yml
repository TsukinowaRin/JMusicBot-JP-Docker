name: Docker Launcher

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          bundle_dir="release-assets/JMusicBot-JP-Docker-${TAG_NAME}"
          mkdir -p "${bundle_dir}/scripts"
          cp README.md Dockerfile compose.yaml config.template.txt "${bundle_dir}/"
          cp setup.bat setup.command setup.sh update.bat update.sh uninstall.bat uninstall.sh Install.bat Install.command Install.sh "${bundle_dir}/"
          cp scripts/entrypoint.sh "${bundle_dir}/scripts/"
          sed -i "s/__RELEASE_TAG__/${TAG_NAME}/g" Install.bat "${bundle_dir}/Install.bat"
          chmod +x Install.command Install.sh setup.command setup.sh update.sh uninstall.sh scripts/entrypoint.sh
          chmod +x "${bundle_dir}/Install.command" "${bundle_dir}/Install.sh" "${bundle_dir}/setup.command" "${bundle_dir}/setup.sh" "${bundle_dir}/update.sh" "${bundle_dir}/uninstall.sh" "${bundle_dir}/scripts/entrypoint.sh"
          cd release-assets
          zip -r "../JMusicBot-JP-Docker-${TAG_NAME}.zip" "JMusicBot-JP-Docker-${TAG_NAME}"

      - name: Create or update GitHub Release
        uses: actions/github-script@v7
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const image = process.env.IMAGE_NAME.toLowerCase();
            const body = [
              '## Docker Launcher',
              '',
              `Tag: \`${tag}\``,
              '',
              'This image downloads the latest `Cosgy-Dev/JMusicBot-JP` release jar at container startup.',
              '',
              '### 1. Pull image',
              '',
              '```bash',
              `docker pull ${image}:${tag}`,
              '```',
              '',
              '### 2. Create config.txt',
              '',
              'Linux / macOS / WSL:',
              '',
              '```bash',
              'mkdir -p docker-data',
              `docker run --rm -v "$(pwd)/docker-data:/data" ${image}:${tag}`,
              '```',
              '',
              'Windows PowerShell:',
              '',
              '```powershell',
              'New-Item -ItemType Directory -Force docker-data',
              `docker run --rm -v "$((Get-Location).Path)\\docker-data:/data" ${image}:${tag}`,
              '```',
              '',
              'The first run creates `docker-data/config.txt` and stops because `token` and `owner` are still placeholders.',
              'It may exit with a non-zero status on this first run. That is expected if `docker-data/config.txt` was created.',
              '',
              'Edit `docker-data/config.txt`:',
              '',
              '```txt',
              'token = "YOUR_DISCORD_BOT_TOKEN"',
              'owner = 123456789012345678',
              '```',
              '',
              '- `token` must be a Discord Bot token and must be quoted.',
              '- `owner` must be your Discord user ID and is written without quotes.',
              '- Do not commit or publish a real `docker-data/config.txt` containing tokens.',
              '',
              '### 3. Start bot',
              '',
              'Linux / macOS / WSL:',
              '',
              '```bash',
              'docker run -d \\',
              '  --name jmusicbot-jp \\',
              '  --restart unless-stopped \\',
              '  -v "$(pwd)/docker-data:/data" \\',
              `  ${image}:${tag}`,
              '```',
              '',
              'Windows PowerShell:',
              '',
              '```powershell',
              'docker run -d `',
              '  --name jmusicbot-jp `',
              '  --restart unless-stopped `',
              '  -v "$((Get-Location).Path)\\docker-data:/data" `',
              `  ${image}:${tag}`,
              '```',
              '',
              'Logs:',
              '',
              '```bash',
              'docker logs -f jmusicbot-jp',
              '```',
              '',
              '### Notes',
              '',
              '- Release assets include `Install.bat`, `Install.command`, `Install.sh`, and a zip bundle for local Docker-based setup.',
              '- If you use this repository locally, `setup.bat` works on Windows and `./setup.sh` works on Linux / WSL.',
              '- `config.template.txt` is only the template. Edit the generated `docker-data/config.txt` for actual bot settings.',
              '- To refresh the upstream jar while keeping config, use `update.bat` or `./update.sh`.',
              '- To remove the container, use `uninstall.bat` or `./uninstall.sh`; `docker-data/` is kept by default.'
            ].join('\n');
            const assets = [
              { name: `JMusicBot-JP-Docker-${tag}.zip`, path: `JMusicBot-JP-Docker-${tag}.zip`, contentType: 'application/zip' },
              { name: 'Install.bat', path: 'Install.bat', contentType: 'application/octet-stream' },
              { name: 'Install.command', path: 'Install.command', contentType: 'application/octet-stream' },
              { name: 'Install.sh', path: 'Install.sh', contentType: 'application/octet-stream' }
            ];
            let releaseId;

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              releaseId = existing.data.id;
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: releaseId,
                name: tag,
                body,
                draft: false,
                prerelease: /(?:alpha|beta|rc|pre)/i.test(tag)
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                body,
                generate_release_notes: true,
                draft: false,
                prerelease: /(?:alpha|beta|rc|pre)/i.test(tag)
              });
              releaseId = created.data.id;
            }

            const release = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId
            });

            for (const asset of release.data.assets) {
              if (!assets.some((candidate) => candidate.name === asset.name)) continue;
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id
              });
            }

            for (const asset of assets) {
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: releaseId,
                name: asset.name,
                headers: {
                  'content-type': asset.contentType,
                  'content-length': fs.statSync(asset.path).size
                },
                data: fs.readFileSync(asset.path)
              });
            }
