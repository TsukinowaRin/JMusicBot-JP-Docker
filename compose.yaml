services:
  jmusicbot:
    build:
      context: .
    image: jmusicbot-jp-launcher:local
    container_name: jmusicbot-jp
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      JAVA_OPTS: ${JAVA_OPTS:-}
      JMUSICBOT_RELEASE_REPO: ${JMUSICBOT_RELEASE_REPO:-Cosgy-Dev/JMusicBot-JP}
    volumes:
      - ./docker-data:/data
